<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; background: transparent; font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif; overflow: hidden; }
  .t { margin: 8px; display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px;
       background: rgba(12, 12, 22, .94); border: 1px solid #2a2a44; color: #e8e8f5;
       box-shadow: 0 0 0 1px rgba(0,229,255,.15), 0 8px 30px rgba(0,0,0,.5);
       transform: translateX(380px); transition: transform .28s cubic-bezier(.2,.9,.3,1.2); }
  .t.show { transform: none; }
  .dot { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #07070d; background: #00e5ff; box-shadow: 0 0 16px #00e5ff; }
  .err .dot { background: #ff3d71; box-shadow: 0 0 16px #ff3d71; }
  .rec .dot { background: #ff3d71; box-shadow: 0 0 16px #ff3d71; animation: p 1s infinite alternate; }
  @keyframes p { to { opacity: .5; } }
  .title { font-weight: 700; font-size: 14px; }
  .body { font-size: 12px; color: #9a9ab8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
</style></head>
<body>
<div class="t" id="t"><div class="dot" id="dot">✓</div><div><div class="title" id="title"></div><div class="body" id="body"></div></div></div>
<script>
  const t = document.getElementById('t');
  // Alert sounds, generated so no audio files are needed. Each action has its own sound.
  let actx;
  const SOUNDS = {
    ok: [[880, 0, 'sine'], [1320, 0.09, 'sine']],          // clip saved: rising chime
    err: [[440, 0, 'triangle'], [330, 0.12, 'triangle']],  // problem: falling tone
    rec: [[660, 0, 'sine'], [660, 0.16, 'sine']],           // recording: double beep
    shot: [[2400, 0, 'square', 0.035], [1600, 0.04, 'square', 0.04]], // screenshot: shutter click
    mark: [[1175, 0, 'sine', 0.12]],                         // bookmark: single ping
  };
  function chime(kind) {
    actx = actx || new AudioContext();
    for (const [f, delay, type, len = 0.18] of SOUNDS[kind] || SOUNDS.ok) {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(type === 'square' ? 0.06 : 0.18, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.02);
    }
  }
  window.toastApi.onToast(({ title, body, kind, sound }) => {
    if (sound) chime(kind);
    t.className = 't ' + kind;
    document.getElementById('dot').textContent = { err: '!', rec: '●', shot: '◉', mark: '★' }[kind] || '✓';
    document.getElementById('title').textContent = title;
    document.getElementById('body').textContent = body || '';
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  });
</script>
</body></html>
