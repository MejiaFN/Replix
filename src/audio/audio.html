<!doctype html>
<html><head><meta charset="utf-8"><title>Replix audio</title></head>
<body>
<script>
// Hidden window: captures system audio (WASAPI loopback via Chromium) and the
// mic, mixes them with WebAudio and streams raw PCM to the main process.
let ctx, streams = [];

async function stopAll() {
  streams.forEach((s) => s.getTracks().forEach((t) => t.stop()));
  streams = [];
  if (ctx) { await ctx.close().catch(() => {}); ctx = null; }
}

async function startAudio(cfg) {
  await stopAll();
  if (!cfg.systemAudio && !cfg.mic) return;
  ctx = new AudioContext({ sampleRate: 48000 });
  await ctx.audioWorklet.addModule('pcm-worklet.js');
  const node = new AudioWorkletNode(ctx, 'pcm-writer', { channelCount: 2, channelCountMode: 'explicit' });
  node.port.onmessage = (e) => window.replixAudio.pcm(e.data);
  // A silent source keeps the stream flowing even when nothing is playing.
  const silence = ctx.createConstantSource(); silence.offset.value = 0; silence.connect(node); silence.start();

  const add = (stream, vol) => {
    streams.push(stream);
    const g = ctx.createGain(); g.gain.value = vol;
    ctx.createMediaStreamSource(stream).connect(g).connect(node);
  };
  if (cfg.systemAudio) {
    try {
      const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      s.getVideoTracks().forEach((t) => { t.stop(); s.removeTrack(t); });
      if (s.getAudioTracks().length) add(s, cfg.systemVolume); else window.replixAudio.log('No system audio track');
    } catch (e) { window.replixAudio.log('System audio failed: ' + e.message); }
  }
  if (cfg.mic) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: {
        deviceId: cfg.micDeviceId && cfg.micDeviceId !== 'default' ? { exact: cfg.micDeviceId } : undefined,
        echoCancellation: false, noiseSuppression: true, autoGainControl: false } });
      add(s, cfg.micVolume);
    } catch (e) { window.replixAudio.log('Mic failed: ' + e.message); }
  }
}

window.replixAudio.onConfig((cfg) => startAudio(cfg).catch((e) => window.replixAudio.log(e.message)));
window.replixAudio.onStop(() => stopAll());
window.replixAudio.ready();
</script>
</body></html>
